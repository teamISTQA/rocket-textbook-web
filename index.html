<script>(function(){
var D=JSON.parse(document.getElementById('blob').textContent);
var f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),
    k=document.getElementById('k'),msg=document.getElementById('msg'),KEY='rt-pass';
function say(t,cls){msg.textContent=t;msg.className=cls?'msg '+cls:'msg'}
function bin(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function unlock(pass){
  b.disabled=true;say('開いています（鍵の計算に数秒かかります）','wait');
  try{
    if(typeof DecompressionStream!=='function')throw new Error('unsupported');
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bin(D.salt),iterations:D.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.iv)},key,bin(D.data));
    var st=new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    var html=await new Response(st).text();
    if(k.checked){try{localStorage.setItem(KEY,pass)}catch(e){}}
    document.open();document.write(html);document.close();
  }catch(e){
    try{localStorage.removeItem(KEY)}catch(_){}
    b.disabled=false;p.value='';p.focus();
    say(e&&e.message==='unsupported'?'このブラウザでは開けません（Chrome・Safari・Firefox の新しい版で開いてください）':'パスワードが違います','err');
  }
}
f.addEventListener('submit',function(e){e.preventDefault();unlock(p.value)});
var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
if(saved){k.checked=true;unlock(saved)}else{p.focus()}
})();</script>
